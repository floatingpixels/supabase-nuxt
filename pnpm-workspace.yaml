allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@snaplet/seed': true
  esbuild: true
  supabase: true
  unrs-resolver: true

# This repo intentionally tracks fresh @supabase releases, so the default 24h
# release-age gate would fail CI installs for a day after every routine bump.
# The committed lockfile plus --frozen-lockfile installs remain the
# supply-chain control (same setting as besmyle-portal).
minimumReleaseAge: 0
